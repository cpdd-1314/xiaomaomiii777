<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>宝子官宣 · 大特效视频生成器</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <meta name="description" content="上传头像，一键生成「感谢宝子官宣我们群」炫酷特效视频，支持烟花、星河、霓虹、粒子、金粉、爱心等多种大特效。" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 顶部标题 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">🎬</span>
        <div>
          <h1>宝子官宣 · 大特效生成器</h1>
          <p class="sub">上传头像 → 选特效 → 生成「感谢宝子官宣我们群」炫酷视频</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <!-- 左侧：控制面板 -->
      <section class="panel" aria-label="控制面板">
        <!-- 1. 上传头像 -->
        <fieldset class="block">
          <legend>① 上传头像</legend>
          <label id="dropzone" class="dropzone" for="fileInput" tabindex="0"
                 aria-label="点击或拖拽图片到此处上传头像">
            <img id="avatarPreview" class="avatar-preview hidden" alt="头像预览" />
            <div id="dzHint" class="dz-hint">
              <span class="dz-icon">🖼️</span>
              <span>点击选择 / 拖拽图片到这里</span>
              <small>支持 PNG / JPG / WEBP，建议正方形清晰头像</small>
            </div>
            <input id="fileInput" class="visually-hidden" type="file" accept="image/*" />
          </label>
          <button id="clearAvatar" class="btn btn-ghost hidden" type="button">移除头像</button>
        </fieldset>

        <!-- 2. 选择特效 -->
        <fieldset class="block">
          <legend>② 选择大特效</legend>
          <div id="effectGrid" class="effect-grid" role="radiogroup" aria-label="特效样式">
            <button class="effect-card" type="button" data-effect="fireworks" role="radio" aria-checked="true"
                    style="--c1:#1b2a6b;--c2:#ff6a00">
              <span class="ec-emoji">🎆</span><span class="ec-name">烟花盛典</span>
            </button>
            <button class="effect-card" type="button" data-effect="starlight" role="radio" aria-checked="false"
                    style="--c1:#0b1e4d;--c2:#6a3cff">
              <span class="ec-emoji">✨</span><span class="ec-name">星河璀璨</span>
            </button>
            <button class="effect-card" type="button" data-effect="neon" role="radio" aria-checked="false"
                    style="--c1:#00f0ff;--c2:#ff00e6">
              <span class="ec-emoji">🌈</span><span class="ec-name">霓虹脉冲</span>
            </button>
            <button class="effect-card" type="button" data-effect="particles" role="radio" aria-checked="false"
                    style="--c1:#003a5d;--c2:#00e5ff">
              <span class="ec-emoji">💫</span><span class="ec-name">粒子汇聚</span>
            </button>
            <button class="effect-card" type="button" data-effect="gold" role="radio" aria-checked="false"
                    style="--c1:#5a1600;--c2:#ffd700">
              <span class="ec-emoji">🪙</span><span class="ec-name">金粉富贵</span>
            </button>
            <button class="effect-card" type="button" data-effect="hearts" role="radio" aria-checked="false"
                    style="--c1:#ff7eb3;--c2:#ff5e8a">
              <span class="ec-emoji">💖</span><span class="ec-name">爱心满天</span>
            </button>
            <button class="effect-card" type="button" data-effect="fire" role="radio" aria-checked="false"
                    style="--c1:#3a0a00;--c2:#ff7a00">
              <span class="ec-emoji">🔥</span><span class="ec-name">烈焰升腾</span>
            </button>
            <button class="effect-card" type="button" data-effect="warp" role="radio" aria-checked="false"
                    style="--c1:#1b0140;--c2:#00d4ff">
              <span class="ec-emoji">🚀</span><span class="ec-name">时空隧道</span>
            </button>
            <button class="effect-card" type="button" data-effect="confetti" role="radio" aria-checked="false"
                    style="--c1:#ff4d6d;--c2:#ffd24d">
              <span class="ec-emoji">🎊</span><span class="ec-name">礼花满天</span>
            </button>
            <button class="effect-card" type="button" data-effect="crown" role="radio" aria-checked="false"
                    style="--c1:#3a2a00;--c2:#ffd24d">
              <span class="ec-emoji">👑</span><span class="ec-name">皇冠加冕</span>
            </button>
            <button class="effect-card" type="button" data-effect="aurora" role="radio" aria-checked="false"
                    style="--c1:#021b2e;--c2:#2bff9e">
              <span class="ec-emoji">🌌</span><span class="ec-name">极光盛宴</span>
            </button>
            <button class="effect-card" type="button" data-effect="thunder" role="radio" aria-checked="false"
                    style="--c1:#0a0e1a;--c2:#6db3ff">
              <span class="ec-emoji">⚡</span><span class="ec-name">雷霆万钧</span>
            </button>
          </div>
        </fieldset>

        <!-- 3. 文案 -->
        <fieldset class="block">
          <legend>③ 文案内容</legend>
          <label class="field">
            <span>主标题</span>
            <input id="mainText" type="text" maxlength="20" value="感谢宝子官宣我们群" />
          </label>
          <label class="field">
            <span>副标题（可选）</span>
            <input id="captionText" type="text" maxlength="24" value="✦ 全群沸腾 · 撒花庆祝 ✦" />
          </label>
        </fieldset>

        <!-- ④ 网友名单 -->
        <fieldset class="block">
          <legend>④ 网友名单</legend>
          <label class="field">
            <span>每行写一个名字，视频里会滚动 + 漂浮气泡展示</span>
            <textarea id="namesText" rows="3" placeholder="小美&#10;阿强&#10;老王"></textarea>
          </label>
        </fieldset>

        <!-- 5. 画幅 -->
        <fieldset class="block">
          <legend>⑤ 视频画幅</legend>
          <div class="seg" role="radiogroup" aria-label="视频画幅">
            <button class="seg-btn" type="button" data-size="portrait" role="radio" aria-checked="true">竖屏 1080×1350</button>
            <button class="seg-btn" type="button" data-size="square" role="radio" aria-checked="false">方屏 1080×1080</button>
            <button class="seg-btn" type="button" data-size="story" role="radio" aria-checked="false">全屏 1080×1920</button>
          </div>
        </fieldset>

        <!-- 6. 声音 -->
        <fieldset class="block">
          <legend>⑥ 声音</legend>
          <label class="field row">
            <input id="soundToggle" type="checkbox" checked />
            <span>开启庆祝音效 🔊</span>
          </label>
          <label class="field">
            <span>背景音乐（可选，上传 MP3/WAV 将覆盖默认音效）</span>
            <input id="bgmInput" type="file" accept="audio/*" />
          </label>
        </fieldset>

        <!-- 操作 -->
        <div class="actions">
          <button id="playBtn" class="btn btn-secondary" type="button">▶ 预览动画</button>
          <button id="stopBtn" class="btn btn-ghost" type="button" disabled>⏸ 停止</button>
          <button id="genBtn" class="btn btn-primary" type="button">🎥 生成并下载视频</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite">请先上传头像，再选择特效。</p>
      </section>

      <!-- 右侧：预览 + 结果 -->
      <section class="stage" aria-label="预览区">
        <div class="canvas-wrap">
          <canvas id="canvas" width="1080" height="1350" aria-label="特效预览画布"></canvas>
        </div>

        <div id="resultWrap" class="result hidden">
          <h2>🎉 视频已生成</h2>
          <video id="resultVideo" controls playsinline></video>
          <a id="downloadLink" class="btn btn-primary" download="宝子官宣特效.webm">⬇ 下载视频（.webm）</a>
          <p class="hint">提示：.webm 在 Chrome / Edge / 安卓 可直接播放；发给微信好友也能看。如需 MP4 可再次转换。</p>
        </div>
      </section>
    </main>

    <footer class="foot">
      <span>纯前端运行 · 头像仅在本地处理，不会上传任何服务器 🔒</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
